name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check polestar_exporter tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e .[dev]
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t polestar-exporter:ci .
      - name: Smoke test (starts, then exits with config error)
        run: |
          set +e
          output=$(docker run --rm polestar-exporter:ci 2>&1)
          status=$?
          echo "$output"
          # Without credentials the exporter must fail fast with a clear message
          [ $status -ne 0 ] && echo "$output" | grep -q "POLESTAR_EMAIL"
